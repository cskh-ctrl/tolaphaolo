name: pack
on:
  push:
    branches: [main]
    paths: ['pack.trigger']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  pack:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: download episode zips
        env: { GH_TOKEN: '${{ github.token }}' }
        run: mkdir -p eps && gh release download videos -p 'P0*.zip' -D eps --clobber
      - name: build batches
        run: python3 tools/package_batches.py batches --src eps --dest dist --per 10
      - name: upload
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh release upload videos dist/*.zip --clobber
