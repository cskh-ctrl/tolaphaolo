name: render
on:
  push:
    branches: [main]
    paths: ['queue.json']
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: render-${{ github.sha }}
jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.q.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: q
        run: echo "matrix=$(jq -c '.render' queue.json)" >> "$GITHUB_OUTPUT"
      - name: ensure release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh release view videos >/dev/null 2>&1 || gh release create videos --title "Video Tớ là Phaolo" --notes "Video đã render. Tải các file Dot_*.zip (mỗi file 10 video)." || true
  render:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        project: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q numpy scipy
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium >/dev/null
      - name: render frames
        run: node render.mjs --project projects/${{ matrix.project }} --format jpeg --workers 4 --preset veryfast
      - name: mix + cover
        run: |
          python3 audio/mix.py --project projects/${{ matrix.project }} --out projects/${{ matrix.project }}/out/video.mp4
          python3 tools/make_cover.py --project projects/${{ matrix.project }}
      - name: package
        run: python3 tools/package_batches.py one --project projects/${{ matrix.project }} --dest dist
      - name: upload to release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh release upload videos dist/*.zip --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}
          path: dist/*.zip
          retention-days: 30
